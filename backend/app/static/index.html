<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>מערכת תחקור תרגילים</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; color: #17202a; }
    header { padding: 16px 20px; background: #17202a; color: white; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    header h1 { font-size: 20px; margin: 0 0 0 auto; }
    select, button { padding: 10px 12px; border-radius: 8px; border: 1px solid #ccd1d1; font-size: 14px; }
    button { cursor: pointer; font-weight: 700; }
    main { display:grid; grid-template-columns: 300px minmax(0, 1fr); height:calc(100vh - 72px); min-height:560px; }
    aside { padding:16px; background:white; border-left:1px solid #ddd; overflow:auto; }
    .map-area { display:flex; flex-direction:column; min-width:0; min-height:0; }
    #map { flex:1; min-height:360px; }
    #timeline { background:#fff; border-top:1px solid #ddd; padding:12px 20px 14px; direction:rtl; }
    .timeline-header { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:8px; }
    .timeline-current { font-variant-numeric:tabular-nums; color:#425466; font-size:13px; }
    .timeline-controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:8px; }
    .timeline-controls button { min-width:78px; padding:7px 12px; }
    .timeline-controls label { display:flex; align-items:center; gap:6px; font-size:13px; }
    .timeline-controls .rate-control { margin-right:auto; }
    .timeline-controls select { padding:7px 10px; }
    .timeline-chart { direction:ltr; }
    .timeline-lanes { display:grid; gap:3px; min-height:16px; max-height:64px; overflow-y:auto; margin:0 7px 5px; }
    .timeline-lane { position:relative; height:7px; background:#edf0f2; border-radius:999px; overflow:hidden; }
    .timeline-range { position:absolute; top:0; bottom:0; min-width:4px; border-radius:999px; }
    .timeline-event { position:absolute; top:50%; width:10px; height:10px; border:2px solid #fff; border-radius:50%; background:#dc2626; box-shadow:0 0 0 1px #991b1b; transform:translate(-50%, -50%); }
    #timelineCursor { display:block; width:100%; margin:0; accent-color:#17202a; }
    .timeline-labels { display:flex; justify-content:space-between; gap:16px; direction:ltr; margin-top:3px; color:#68737d; font-size:12px; font-variant-numeric:tabular-nums; }
    .timeline-empty { padding:8px 0; text-align:center; color:#68737d; font-size:13px; }
    .card { border:1px solid #e0e0e0; border-radius:10px; padding:12px; margin-bottom:10px; background:#fff; }
    .muted { color:#68737d; font-size:12px; }
    #participants { max-height:min(52vh, 520px); overflow-y:auto; overscroll-behavior:contain; scrollbar-gutter:stable; padding-left:4px; }
    .participant { display:flex; width:100%; text-align:right; margin-top:6px; padding:10px; border:1px solid #e0e0e0; border-radius:8px; background:#fafafa; cursor:pointer; gap:10px; align-items:flex-start; }
    .participant input { margin-top:3px; accent-color:var(--track-color); }
    .participant-content { flex:1; min-width:0; }
    .track-color { width:12px; height:12px; margin-top:3px; border-radius:50%; background:var(--track-color); flex:0 0 auto; }
    .track-summary { padding:6px 8px 6px 0; border-bottom:1px solid #eee; }
    .track-summary:last-child { border-bottom:0; }
    .event-availability { display:flex; align-items:center; gap:7px; margin:9px 0 6px; padding:8px 10px; border-radius:8px; background:#f3f4f6; color:#4b5563; font-size:13px; font-weight:700; }
    .event-availability::before { content:''; width:10px; height:10px; border-radius:50%; background:#9ca3af; flex:0 0 auto; }
    .event-availability.has-events { background:#fef2f2; color:#991b1b; }
    .event-availability.has-events::before { background:#dc2626; }
    .track-arrow-icon { background:transparent; border:0; }
    .track-arrow { display:block; width:20px; height:20px; background:var(--arrow-color); clip-path:polygon(50% 0, 100% 100%, 50% 72%, 0 100%); filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff); transform-origin:50% 50%; }
    @media(max-width:800px){ main{grid-template-columns:1fr; height:auto; min-height:0;} aside{order:2;} .map-area{min-height:70vh;} #map{height:60vh; flex:none; min-height:320px;} #timeline{padding:10px 12px 12px;} #participants{max-height:40vh;} }
  </style>
</head>
<body>
<header>
  <h1>מערכת תחקור תרגילים — Prototype 0.2</h1>
  <select id="exerciseSelect"><option value="">בחר תרגיל</option></select>
  <button id="refresh">רענן</button>
</header>
<main>
  <aside>
    <div class="card">
      <strong id="exerciseName">לא נבחר תרגיל</strong>
      <div class="muted" id="exerciseStatus"></div>
    </div>
    <div class="card">
      <strong>משתתפים</strong>
      <div class="muted">סמן משתתף כדי להציג את המסלול שלו. ניתן להציג מספר מסלולים יחד.</div>
      <div id="eventAvailability" class="event-availability">בחר תרגיל כדי לבדוק אם קיימים אירועים</div>
      <div id="participants"></div>
    </div>
    <div class="card">
      <strong>מסלולים מוצגים</strong>
      <div id="trackInfo" class="muted">אין מסלולים מוצגים.</div>
    </div>
  </aside>
  <div class="map-area">
    <div id="map"></div>
    <section id="timeline" aria-label="ציר הזמן של המסלולים המוצגים">
      <div class="timeline-header">
        <strong>ציר זמן</strong>
        <span id="timelineCurrent" class="timeline-current"></span>
      </div>
      <div class="timeline-controls" aria-label="פקדי ניגון">
        <button id="playPauseButton" type="button" disabled>PLAY</button>
        <button id="stopButton" type="button" disabled>STOP</button>
        <label class="rate-control" for="playbackRate">
          קצב
          <select id="playbackRate" disabled>
            <option value="1">נקודה אחת בשנייה</option>
            <option value="5">5 נקודות בשנייה</option>
            <option value="10">10 נקודות בשנייה</option>
          </select>
        </label>
        <label for="trailEnabled">
          <input id="trailEnabled" type="checkbox" disabled />
          שובל
        </label>
        <select id="trailLength" aria-label="אורך השובל" disabled>
          <option value="10">10 נקודות</option>
          <option value="30" selected>30 נקודות</option>
          <option value="50">50 נקודות</option>
          <option value="100">100 נקודות</option>
        </select>
        <label for="eventsEnabled">
          <input id="eventsEnabled" type="checkbox" disabled />
          הצג אירועים
        </label>
      </div>
      <div id="timelineEmpty" class="timeline-empty">בחר מסלול אחד לפחות כדי להציג את ציר הזמן.</div>
      <div id="timelineChart" class="timeline-chart" hidden>
        <div id="timelineLanes" class="timeline-lanes"></div>
        <input id="timelineCursor" type="range" aria-label="נקודת הזמן הנוכחית" />
        <div class="timeline-labels">
          <time id="timelineStart"></time>
          <time id="timelineEnd"></time>
        </div>
      </div>
    </section>
  </div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
const map = L.map('map').setView([31.95, 35.13], 13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 20,
  attribution: '&copy; OpenStreetMap contributors'
}).addTo(map);

const trackColors = ['#2563eb', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#4d7c0f', '#ca8a04', '#475569'];
const eventReporterRoles = new Set(['רבשץ', 'חמל', 'מנהל תרגיל']);
const visibleTracks = new Map();
const eventMarkerLayer = L.layerGroup().addTo(map);
let currentExercise = null;
let loadedEvents = [];
let playbackTimer = null;
let playbackTimestamps = [];
let playbackIndex = 0;

async function api(path) {
  const response = await fetch('/api/v1' + path);
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}

async function loadExercises() {
  const data = await api('/exercises');
  const select = document.getElementById('exerciseSelect');
  const previous = select.value;
  select.innerHTML = '<option value="">בחר תרגיל</option>';
  data.items.forEach(exercise => {
    const option = document.createElement('option');
    option.value = exercise.id;
    option.textContent = `${exercise.name} — ${exercise.status}`;
    select.appendChild(option);
  });
  if (previous) select.value = previous;
}

async function loadExercise(id) {
  clearEvents();
  clearTracks();
  currentExercise = id;
  const [data, eventData] = await Promise.all([
    api(`/exercises/${id}/map-bootstrap`),
    api(`/exercises/${id}/events`)
  ]);
  if (id !== currentExercise) return;
  loadedEvents = normalizeEvents(eventData.items);
  document.getElementById('exerciseName').textContent = data.exercise.name;
  document.getElementById('exerciseStatus').textContent = `סטטוס: ${data.exercise.status}`;
  const root = document.getElementById('participants');
  root.innerHTML = '';
  data.participants.forEach((participant, index) => addParticipant(root, participant, trackColors[index % trackColors.length]));
  renderEventAvailability();
  const eventsCheckbox = document.getElementById('eventsEnabled');
  eventsCheckbox.checked = false;
  eventsCheckbox.disabled = !loadedEvents.length;
}

function renderEventAvailability() {
  const indicator = document.getElementById('eventAvailability');
  const count = loadedEvents.length;
  indicator.classList.toggle('has-events', count > 0);
  indicator.textContent = count > 0
    ? `התרגיל מכיל אירועים (${count})`
    : 'התרגיל לא מכיל אירועים';
}

function clearEvents() {
  loadedEvents = [];
  eventMarkerLayer.clearLayers();
  const checkbox = document.getElementById('eventsEnabled');
  checkbox.checked = false;
  checkbox.disabled = true;
  const indicator = document.getElementById('eventAvailability');
  indicator.classList.remove('has-events');
  indicator.textContent = 'בודק אם התרגיל מכיל אירועים…';
}

function normalizeEvents(items) {
  return items
    .map(event => ({
      ...event,
      timestamp: Date.parse(event.occurredAt),
      latlng: [event.latitude, event.longitude],
      marker: null
    }))
    .filter(event => Number.isFinite(event.timestamp) && eventReporterRoles.has(event.reporterRole))
    .sort((first, second) => first.timestamp - second.timestamp);
}

function eventPopup(event) {
  const root = document.createElement('div');
  const title = document.createElement('strong');
  title.textContent = event.description;
  const reporter = document.createElement('div');
  reporter.textContent = `${event.reporterName} — ${event.reporterRole}`;
  const time = document.createElement('div');
  time.textContent = formatTimelineTime(event.timestamp);
  root.append(title, reporter, time);
  return root;
}

function markerForEvent(event) {
  if (!event.marker) {
    event.marker = L.circleMarker(event.latlng, {
      radius: 9,
      color: '#fff',
      weight: 2,
      fillColor: '#dc2626',
      fillOpacity: 1
    })
      .bindPopup(eventPopup(event));
  }
  return event.marker;
}

function renderEventsAtTime(timestamp) {
  if (!document.getElementById('eventsEnabled').checked) {
    eventMarkerLayer.clearLayers();
    return;
  }
  for (const event of loadedEvents) {
    const marker = markerForEvent(event);
    if (event.timestamp <= timestamp) {
      if (!eventMarkerLayer.hasLayer(marker)) marker.addTo(eventMarkerLayer);
    } else if (eventMarkerLayer.hasLayer(marker)) {
      eventMarkerLayer.removeLayer(marker);
    }
  }
}

function addParticipant(root, participant, color) {
  const label = document.createElement('label');
  label.className = 'participant';
  label.style.setProperty('--track-color', color);
  const checkbox = document.createElement('input');
  checkbox.type = 'checkbox';
  checkbox.onchange = () => toggleTrack(participant, checkbox, color);
  const dot = document.createElement('span');
  dot.className = 'track-color';
  const content = document.createElement('span');
  content.className = 'participant-content';
  const name = document.createElement('strong');
  name.textContent = participant.displayName + (participant.callsign ? ` — ${participant.callsign}` : '');
  const count = document.createElement('div');
  count.className = 'muted';
  count.textContent = `${participant.pointCount} נקודות GPS`;
  content.append(name, count);
  label.append(checkbox, dot, content);
  root.appendChild(label);
}

function clearTracks() {
  for (const track of visibleTracks.values()) track.layers.forEach(layer => map.removeLayer(layer));
  visibleTracks.clear();
  renderTrackInfo();
  updateTimeline();
}

async function toggleTrack(participant, checkbox, color) {
  if (!checkbox.checked) {
    const track = visibleTracks.get(participant.id);
    if (track) track.layers.forEach(layer => map.removeLayer(layer));
    visibleTracks.delete(participant.id);
    renderTrackInfo();
    updateTimeline();
    fitVisibleTracks();
    return;
  }
  checkbox.disabled = true;
  const requestedExercise = currentExercise;
  let data;
  try {
    data = await api(`/exercises/${currentExercise}/tracks/${participant.id}`);
  } catch (error) {
    checkbox.checked = false;
    document.getElementById('trackInfo').textContent = `שגיאה בטעינת המסלול: ${error.message}`;
    checkbox.disabled = false;
    return;
  }
  checkbox.disabled = false;
  if (!checkbox.checked || requestedExercise !== currentExercise) return;
  if (!data.points.length) {
    checkbox.checked = false;
    document.getElementById('trackInfo').textContent = `אין עדיין נקודות GPS עבור ${data.displayName}.`;
    return;
  }
  const timedPoints = data.points
    .map(point => ({
      timestamp: Date.parse(point.capturedAt),
      latlng: [point.latitude, point.longitude]
    }))
    .filter(point => Number.isFinite(point.timestamp))
    .sort((first, second) => first.timestamp - second.timestamp);
  if (!timedPoints.length) {
    checkbox.checked = false;
    document.getElementById('trackInfo').textContent = `לא נמצאו חותמות זמן תקינות עבור ${data.displayName}.`;
    return;
  }
  const line = L.polyline([], {color, weight: 4, opacity: 0.85}).addTo(map);
  const pointLayer = L.layerGroup().addTo(map);
  const startMarker = L.circleMarker(timedPoints[0].latlng, {
    radius: 5,
    color,
    fillColor: color,
    fillOpacity: 1
  }).bindPopup(`תחילת המסלול — ${data.displayName}`);
  const currentMarker = L.circleMarker(timedPoints[0].latlng, {
    radius: 7,
    color,
    fillColor: '#fff',
    fillOpacity: 1,
    weight: 3
  });
  const arrowMarker = L.marker(timedPoints[0].latlng, {
    interactive: false,
    keyboard: false,
    zIndexOffset: 1000,
    icon: createArrowIcon(color, 0)
  });
  visibleTracks.set(participant.id, {
    data,
    color,
    timedPoints,
    allLatLngs: timedPoints.map(point => point.latlng),
    visiblePointCount: 0,
    visibleStartIndex: 0,
    line,
    pointLayer,
    startMarker,
    currentMarker,
    arrowMarker,
    layers: [line, pointLayer, startMarker, currentMarker, arrowMarker]
  });
  renderTrackInfo();
  updateTimeline();
  fitVisibleTracks();
}

function fitVisibleTracks() {
  if (!visibleTracks.size) return;
  const bounds = L.latLngBounds([]);
  for (const track of visibleTracks.values()) {
    track.allLatLngs.forEach(latlng => bounds.extend(latlng));
  }
  if (bounds.isValid()) map.fitBounds(bounds, {padding: [30, 30]});
}

function renderTrackInfo() {
  const root = document.getElementById('trackInfo');
  root.innerHTML = '';
  if (!visibleTracks.size) {
    root.textContent = 'אין מסלולים מוצגים.';
    return;
  }
  for (const {data, color} of visibleTracks.values()) {
    const item = document.createElement('div');
    item.className = 'track-summary';
    item.style.borderRight = `4px solid ${color}`;
    const title = document.createElement('strong');
    title.textContent = data.displayName;
    const details = document.createElement('div');
    const first = new Date(data.points[0].capturedAt).toLocaleString('he-IL');
    const last = new Date(data.points[data.points.length - 1].capturedAt).toLocaleString('he-IL');
    details.textContent = `${data.count} נקודות · ${first} ← ${last}`;
    item.append(title, details);
    root.appendChild(item);
  }
}

function formatTimelineTime(timestamp) {
  return new Intl.DateTimeFormat('he-IL', {
    dateStyle: 'short',
    timeStyle: 'medium'
  }).format(new Date(timestamp));
}

function setPlaybackPosition(index) {
  if (!playbackTimestamps.length) return;
  playbackIndex = Math.max(0, Math.min(index, playbackTimestamps.length - 1));
  const timestamp = playbackTimestamps[playbackIndex];
  document.getElementById('timelineCursor').value = String(timestamp);
  document.getElementById('timelineCurrent').textContent =
    `נקודה ${playbackIndex + 1} מתוך ${playbackTimestamps.length} · ${formatTimelineTime(timestamp)}`;
  renderMapAtTime(timestamp);
}

function visiblePointCountAtTime(points, timestamp) {
  let low = 0;
  let high = points.length;
  while (low < high) {
    const middle = Math.floor((low + high) / 2);
    if (points[middle].timestamp <= timestamp) low = middle + 1;
    else high = middle;
  }
  return low;
}

function bearingBetween(from, to) {
  const toRadians = value => value * Math.PI / 180;
  const toDegrees = value => value * 180 / Math.PI;
  const lat1 = toRadians(from[0]);
  const lat2 = toRadians(to[0]);
  const longitudeDelta = toRadians(to[1] - from[1]);
  const y = Math.sin(longitudeDelta) * Math.cos(lat2);
  const x = Math.cos(lat1) * Math.sin(lat2) -
    Math.sin(lat1) * Math.cos(lat2) * Math.cos(longitudeDelta);
  return (toDegrees(Math.atan2(y, x)) + 360) % 360;
}

function createArrowIcon(color, bearing) {
  return L.divIcon({
    className: 'track-arrow-icon',
    iconSize: [20, 20],
    iconAnchor: [10, 10],
    html: `<span class="track-arrow" style="--arrow-color:${color};transform:rotate(${bearing}deg)"></span>`
  });
}

function updateTrackArrow(track, startIndex, pointCount) {
  if (pointCount < 2) {
    if (map.hasLayer(track.arrowMarker)) map.removeLayer(track.arrowMarker);
    return;
  }
  const latestIndex = pointCount - 1;
  let previousIndex = latestIndex - 1;
  const latest = track.timedPoints[latestIndex].latlng;
  while (previousIndex >= startIndex) {
    const previous = track.timedPoints[previousIndex].latlng;
    if (previous[0] !== latest[0] || previous[1] !== latest[1]) {
      track.arrowMarker
        .setLatLng(latest)
        .setIcon(createArrowIcon(track.color, bearingBetween(previous, latest)));
      if (!map.hasLayer(track.arrowMarker)) track.arrowMarker.addTo(map);
      if (map.hasLayer(track.currentMarker)) map.removeLayer(track.currentMarker);
      return;
    }
    previousIndex--;
  }
  if (map.hasLayer(track.arrowMarker)) map.removeLayer(track.arrowMarker);
}

function renderMapAtTime(timestamp) {
  const trailEnabled = document.getElementById('trailEnabled').checked;
  const trailLength = Number(document.getElementById('trailLength').value);
  for (const track of visibleTracks.values()) {
    const nextCount = visiblePointCountAtTime(track.timedPoints, timestamp);
    const nextStartIndex = trailEnabled ? Math.max(0, nextCount - trailLength) : 0;
    if (nextCount < track.visiblePointCount || nextStartIndex !== track.visibleStartIndex) {
      track.line.setLatLngs([]);
      track.pointLayer.clearLayers();
      track.visiblePointCount = nextStartIndex;
      track.visibleStartIndex = nextStartIndex;
    }

    for (let index = track.visiblePointCount; index < nextCount; index++) {
      const point = track.timedPoints[index];
      track.line.addLatLng(point.latlng);
      L.circleMarker(point.latlng, {
        radius: 3.5,
        color: '#fff',
        weight: 1,
        fillColor: track.color,
        fillOpacity: 0.9,
        interactive: false
      }).addTo(track.pointLayer);
    }

    if (nextCount > 0) {
      const latest = track.timedPoints[nextCount - 1];
      if (!trailEnabled || nextStartIndex === 0) {
        if (!map.hasLayer(track.startMarker)) track.startMarker.addTo(map);
      } else if (map.hasLayer(track.startMarker)) {
        map.removeLayer(track.startMarker);
      }
      track.currentMarker
        .setLatLng(latest.latlng)
        .bindPopup(`${track.data.displayName}<br>${formatTimelineTime(latest.timestamp)}`);
      if (!map.hasLayer(track.currentMarker)) track.currentMarker.addTo(map);
      updateTrackArrow(track, nextStartIndex, nextCount);
    } else {
      if (map.hasLayer(track.startMarker)) map.removeLayer(track.startMarker);
      if (map.hasLayer(track.currentMarker)) map.removeLayer(track.currentMarker);
      if (map.hasLayer(track.arrowMarker)) map.removeLayer(track.arrowMarker);
    }

    track.visiblePointCount = nextCount;
    track.visibleStartIndex = nextStartIndex;
  }
  renderEventsAtTime(timestamp);
}

function pausePlayback() {
  if (playbackTimer !== null) {
    clearInterval(playbackTimer);
    playbackTimer = null;
  }
  const button = document.getElementById('playPauseButton');
  button.textContent = 'PLAY';
  button.setAttribute('aria-pressed', 'false');
}

function advancePlayback() {
  if (playbackIndex >= playbackTimestamps.length - 1) {
    pausePlayback();
    return;
  }
  setPlaybackPosition(playbackIndex + 1);
  if (playbackIndex >= playbackTimestamps.length - 1) pausePlayback();
}

function startPlayback() {
  if (!playbackTimestamps.length) return;
  if (playbackIndex >= playbackTimestamps.length - 1) setPlaybackPosition(0);
  const rate = Number(document.getElementById('playbackRate').value);
  const button = document.getElementById('playPauseButton');
  button.textContent = 'PAUSE';
  button.setAttribute('aria-pressed', 'true');
  playbackTimer = setInterval(advancePlayback, 1000 / rate);
}

function stopPlayback() {
  pausePlayback();
  if (playbackTimestamps.length) setPlaybackPosition(0);
}

function findNearestPlaybackIndex(timestamp) {
  let low = 0;
  let high = playbackTimestamps.length;
  while (low < high) {
    const middle = Math.floor((low + high) / 2);
    if (playbackTimestamps[middle] < timestamp) low = middle + 1;
    else high = middle;
  }
  if (low === 0) return 0;
  if (low === playbackTimestamps.length) return playbackTimestamps.length - 1;
  return timestamp - playbackTimestamps[low - 1] <= playbackTimestamps[low] - timestamp
    ? low - 1
    : low;
}

function updateTimeline(preserveTimestamp = null) {
  pausePlayback();
  const empty = document.getElementById('timelineEmpty');
  const chart = document.getElementById('timelineChart');
  const current = document.getElementById('timelineCurrent');
  const lanes = document.getElementById('timelineLanes');
  const cursor = document.getElementById('timelineCursor');
  const playPauseButton = document.getElementById('playPauseButton');
  const stopButton = document.getElementById('stopButton');
  const rateSelect = document.getElementById('playbackRate');
  const trailCheckbox = document.getElementById('trailEnabled');
  const trailSelect = document.getElementById('trailLength');
  const trackTimestamps = [...visibleTracks.values()]
    .flatMap(track => track.data.points.map(point => Date.parse(point.capturedAt)))
    .filter(Number.isFinite);
  const eventTimestamps = document.getElementById('eventsEnabled').checked
    ? loadedEvents.map(event => event.timestamp)
    : [];
  playbackTimestamps = [...trackTimestamps, ...eventTimestamps]
    .sort((first, second) => first - second);
  const ranges = [...visibleTracks.values()].map(track => {
    const timestamps = track.data.points
      .map(point => Date.parse(point.capturedAt))
      .filter(Number.isFinite);
    return timestamps.length ? {
      name: track.data.displayName,
      color: track.color,
      start: timestamps.reduce((minimum, timestamp) => Math.min(minimum, timestamp)),
      end: timestamps.reduce((maximum, timestamp) => Math.max(maximum, timestamp))
    } : null;
  }).filter(Boolean);

  if (!playbackTimestamps.length) {
    playbackTimestamps = [];
    playbackIndex = 0;
    empty.hidden = false;
    chart.hidden = true;
    current.textContent = '';
    lanes.innerHTML = '';
    playPauseButton.disabled = true;
    stopButton.disabled = true;
    rateSelect.disabled = true;
    trailCheckbox.disabled = true;
    trailSelect.disabled = true;
    renderEventsAtTime(Number.NEGATIVE_INFINITY);
    return;
  }

  const start = playbackTimestamps[0];
  const end = playbackTimestamps[playbackTimestamps.length - 1];
  const duration = Math.max(end - start, 1);
  document.getElementById('timelineStart').textContent = formatTimelineTime(start);
  document.getElementById('timelineEnd').textContent = formatTimelineTime(end);
  cursor.min = String(start);
  cursor.max = String(end);
  cursor.step = '1';
  lanes.innerHTML = '';

  ranges.forEach(range => {
    const lane = document.createElement('div');
    lane.className = 'timeline-lane';
    lane.setAttribute('aria-label', `${range.name}: ${formatTimelineTime(range.start)} עד ${formatTimelineTime(range.end)}`);
    const segment = document.createElement('span');
    segment.className = 'timeline-range';
    segment.style.background = range.color;
    segment.style.left = `${((range.start - start) / duration) * 100}%`;
    segment.style.width = `${Math.max(((range.end - range.start) / duration) * 100, 0.5)}%`;
    lane.appendChild(segment);
    lanes.appendChild(lane);
  });

  if (eventTimestamps.length) {
    const lane = document.createElement('div');
    lane.className = 'timeline-lane';
    lane.setAttribute('aria-label', 'אירועים');
    loadedEvents.forEach(event => {
      const marker = document.createElement('span');
      marker.className = 'timeline-event';
      marker.style.left = `${((event.timestamp - start) / duration) * 100}%`;
      marker.title = `${formatTimelineTime(event.timestamp)} — ${event.reporterName}: ${event.description}`;
      lane.appendChild(marker);
    });
    lanes.appendChild(lane);
  }

  empty.hidden = true;
  chart.hidden = false;
  playPauseButton.disabled = false;
  stopButton.disabled = false;
  rateSelect.disabled = false;
  trailCheckbox.disabled = false;
  trailSelect.disabled = !trailCheckbox.checked;
  setPlaybackPosition(preserveTimestamp === null ? 0 : findNearestPlaybackIndex(preserveTimestamp));
}

document.getElementById('playPauseButton').onclick = () => {
  if (playbackTimer === null) startPlayback();
  else pausePlayback();
};
document.getElementById('stopButton').onclick = stopPlayback;
document.getElementById('playbackRate').onchange = () => {
  if (playbackTimer === null) return;
  clearInterval(playbackTimer);
  const rate = Number(document.getElementById('playbackRate').value);
  playbackTimer = setInterval(advancePlayback, 1000 / rate);
};
document.getElementById('trailEnabled').onchange = event => {
  document.getElementById('trailLength').disabled = !event.target.checked || !playbackTimestamps.length;
  if (playbackTimestamps.length) renderMapAtTime(playbackTimestamps[playbackIndex]);
};
document.getElementById('trailLength').onchange = () => {
  if (playbackTimestamps.length) renderMapAtTime(playbackTimestamps[playbackIndex]);
};
document.getElementById('eventsEnabled').onchange = event => {
  const checkbox = event.target;
  const previousTimestamp = playbackTimestamps.length
    ? playbackTimestamps[playbackIndex]
    : null;
  if (!checkbox.checked) {
    eventMarkerLayer.clearLayers();
    updateTimeline(previousTimestamp);
    return;
  }
  updateTimeline(previousTimestamp);
};
document.getElementById('timelineCursor').oninput = event => {
  pausePlayback();
  setPlaybackPosition(findNearestPlaybackIndex(Number(event.target.value)));
};
document.getElementById('exerciseSelect').onchange = event => event.target.value && loadExercise(event.target.value);
document.getElementById('refresh').onclick = async () => {
  await loadExercises();
  if (currentExercise) await loadExercise(currentExercise);
};
loadExercises();
</script>
</body>
</html>
