<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>איפוס סיסמה — ReTrace</title>
  <style>
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Arial,sans-serif; color:#18332a; background:linear-gradient(145deg,#eef8f4,#fffaf0); }
    .card { width:min(100%,440px); padding:26px; background:#fff; border:1px solid #d9e7e1; border-radius:18px; box-shadow:0 18px 45px #07543b22; }
    .brand { color:#07543b; text-align:center; font-size:32px; font-weight:900; }
    h1 { margin:12px 0 20px; font-size:22px; text-align:center; }
    label { display:block; margin:12px 0 6px; font-weight:700; }
    input { width:100%; padding:12px; border:1px solid #bcd4ca; border-radius:12px; font-size:16px; }
    input:focus { outline:2px solid #009688; border-color:transparent; }
    button { width:100%; margin-top:18px; padding:13px; border:0; border-radius:12px; color:#fff; background:linear-gradient(90deg,#009688,#07543b); font-size:16px; font-weight:800; cursor:pointer; }
    button:disabled { opacity:.5; cursor:not-allowed; }
    #message { min-height:22px; margin-top:12px; text-align:center; font-size:14px; }
    .error { color:#b42318; } .success { color:#07543b; font-weight:700; }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand">ReTrace</div>
    <h1>הגדרת סיסמה חדשה</h1>
    <form id="resetForm">
      <label for="password">סיסמה חדשה</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required />
      <label for="confirmation">אימות הסיסמה</label>
      <input id="confirmation" type="password" minlength="8" autocomplete="new-password" required />
      <button id="submitButton" type="submit">שמור סיסמה חדשה</button>
      <div id="message"></div>
    </form>
  </main>
  <script>
    const params = new URLSearchParams(location.hash.slice(1));
    const accessToken = params.get('access_token');
    const message = document.getElementById('message');
    if (!accessToken || params.get('type') !== 'recovery') {
      message.className = 'error';
      message.textContent = 'קישור האיפוס אינו תקין או שפג תוקפו. יש לבקש קישור חדש מהאפליקציה.';
      document.getElementById('submitButton').disabled = true;
    }
    document.getElementById('resetForm').onsubmit = async event => {
      event.preventDefault();
      const password = document.getElementById('password').value;
      const confirmation = document.getElementById('confirmation').value;
      const button = document.getElementById('submitButton');
      message.className = 'error';
      if (password.length < 8) return message.textContent = 'הסיסמה חייבת להכיל לפחות 8 תווים.';
      if (password !== confirmation) return message.textContent = 'הסיסמאות אינן תואמות.';
      button.disabled = true;
      message.textContent = '';
      try {
        const response = await fetch('/api/v1/auth/password-reset/confirm', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({access_token:accessToken,password})
        });
        if (!response.ok) throw new Error('הקישור אינו תקין או שפג תוקפו. יש לבקש קישור חדש.');
        history.replaceState(null, '', '/reset-password');
        message.className = 'success';
        message.textContent = 'הסיסמה עודכנה בהצלחה. אפשר לחזור לאפליקציה ולהיכנס.';
        document.querySelectorAll('input').forEach(input => input.disabled = true);
      } catch (error) {
        message.textContent = error.message;
        button.disabled = false;
      }
    };
  </script>
</body>
</html>
